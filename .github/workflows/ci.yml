name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BlazorMarkdownEditor.slnx

      - name: Build
        run: dotnet build BlazorMarkdownEditor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BlazorMarkdownEditor.slnx --configuration Release --no-build

  publish:
    # Publish to nuget.org only for version tags (v1.2.3 → package version 1.2.3).
    # Uses Trusted Publishing (OIDC) — no long-lived API key; the matching policy
    # is configured on nuget.org (repository owner/name + this workflow file).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for the nuget.org token exchange
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: >
          dotnet pack src/BlazorMarkdownEditor/BlazorMarkdownEditor.csproj
          --configuration Release
          --output ./artifacts
          -p:Version=${GITHUB_REF_NAME#v}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
